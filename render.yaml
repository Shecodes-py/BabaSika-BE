services:
  - type: web
    name: babasika-backend
    runtime: python
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput
    startCommand: gunicorn babasika_backend.wsgi:application --workers 4 --worker-class sync --timeout 120
    envVars:
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: false
      - key: MONNIFY_API_KEY
        sync: false
      - key: MONNIFY_SECRET
        sync: false
      - key: MONNIFY_CONTRACT_CODE
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: babasika-db
          property: connectionString
    disk:
      name: staticfiles
      mountPath: /opt/render/project/src/staticfiles
      sizeGB: 1

databases:
  - name: babasika-db
    databaseName: babasika
    plan: free
